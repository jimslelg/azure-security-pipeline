# Control: secret scanning (GitLeaks).
# Scans the FULL git history, not just the working tree — a secret committed
# and later "removed" is still live in history and must be treated as leaked
# (rotate, then rewrite). Runs first in the pipeline: if credentials are in
# the repo, nothing else should proceed.
parameters:
  - name: gitleaksVersion
    type: string
    default: '8.21.2'

steps:
  - checkout: self
    fetchDepth: 0   # full history — shallow clones would hide old leaks
    displayName: 'Checkout (full history for secret scan)'

  - script: |
      set -euo pipefail
      curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${{ parameters.gitleaksVersion }}/gitleaks_${{ parameters.gitleaksVersion }}_linux_x64.tar.gz" \
        | tar -xz -C /usr/local/bin gitleaks
      gitleaks version
    displayName: 'Install GitLeaks (pinned ${{ parameters.gitleaksVersion }})'

  - script: |
      set -euo pipefail
      mkdir -p "$(Build.ArtifactStagingDirectory)/gitleaks"
      gitleaks git \
        --config "$(Build.SourcesDirectory)/.gitleaks.toml" \
        --report-format sarif \
        --report-path "$(Build.ArtifactStagingDirectory)/gitleaks/results.sarif" \
        --redact \
        "$(Build.SourcesDirectory)"
    displayName: 'Secret gate: gitleaks (full history, findings redacted in logs)'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish GitLeaks SARIF'
    condition: succeededOrFailed()
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)/gitleaks'
      artifactName: 'CodeAnalysisLogs'
