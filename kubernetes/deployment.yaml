# Hardened workload spec — complies with Pod Security 'restricted' and the
# Azure Policy deny assignments from terraform/modules/policy:
#   - image by immutable digest reference, from our ACR only (policy-enforced)
#   - non-root fixed UID matching the Dockerfile USER
#   - read-only root filesystem; the ONLY writable mount is the tmpfs
#     secrets volume managed by the CSI driver
#   - all capabilities dropped, no privilege escalation, RuntimeDefault seccomp
#   - resource limits bound the blast radius of a compromised/runaway pod
#   - service account token NOT auto-mounted; the workload-identity webhook
#     injects only the projected token the pod actually needs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  namespace: inventory
  labels:
    app.kubernetes.io/name: inventory-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: inventory-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory-api
          # ${IMAGE_REF} is the digest-pinned reference produced by the build
          # stage and verified by cosign before this manifest is applied.
          image: "${IMAGE_REF}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: inventory-api-secrets
