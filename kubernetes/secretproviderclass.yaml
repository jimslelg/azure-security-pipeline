# Key Vault integration via the Secrets Store CSI driver.
# Secrets are mounted as an in-memory (tmpfs) volume file — they never exist
# as Kubernetes Secret objects (nothing readable via `kubectl get secret`,
# nothing at rest in etcd), never appear in env vars, and rotate
# automatically when the driver's rotation poll picks up a new version.
# Auth: the pod's federated workload identity — no vault credential exists.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: inventory-api-secrets
  namespace: inventory
spec:
  provider: azure
  parameters:
    clientID: "${WORKLOAD_IDENTITY_CLIENT_ID}"   # workload identity federation
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: api-config
          objectType: secret
