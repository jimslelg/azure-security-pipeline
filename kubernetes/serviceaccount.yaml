# Service account federated to the user-assigned managed identity
# (terraform/modules/identity → id-<env>-workload). The workload identity
# webhook projects a short-lived token into pods using this SA; Entra ID
# exchanges it for Azure tokens scoped to the identity's RBAC roles
# (Key Vault Secrets User — read-only, nothing else).
#
# ${WORKLOAD_IDENTITY_CLIENT_ID} is substituted at deploy time from the
# Terraform output — never hardcoded, differs per environment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory-api
  namespace: inventory
  annotations:
    azure.workload.identity/client-id: "${WORKLOAD_IDENTITY_CLIENT_ID}"
  labels:
    app.kubernetes.io/name: inventory-api
    azure.workload.identity/use: "true"
