# SonarQube project configuration. The quality gate itself (0 new
# vulnerabilities, hotspots 100% reviewed, coverage threshold) is defined on
# the SonarQube server so it cannot be weakened from the repo.
sonar.projectKey=azure-security-pipeline
sonar.projectName=azure-security-pipeline

sonar.sources=app/src
sonar.tests=app/tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=app/coverage.xml

sonar.sourceEncoding=UTF-8
